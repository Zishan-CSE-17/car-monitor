<style>
:root{--bg1:#f0f2f5;--bg2:#f0f2f5;--tx:#050505;--mut:#65676b;--card:#ffffff;--bd:#ced0d4;--in:#f0f2f5;--ok:#42b72a;--warn:#e09f00;--bad:#fa383e;--a1:#1877f2;--a2:#1877f2;--dg:#1c1e21;--sh:0 1px 2px rgba(0,0,0,.2);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#18191a;--bg2:#18191a;--tx:#e4e6eb;--mut:#b0b3b8;--card:#242526;--bd:#3e4042;--in:#3a3b3c;--ok:#45bd62;--warn:#f7b928;--bad:#ff5a5f;--a1:#2d88ff;--a2:#2d88ff;--dg:#3a3b3c;--sh:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#18191a;--bg2:#18191a;--tx:#e4e6eb;--mut:#b0b3b8;--card:#242526;--bd:#3e4042;--in:#3a3b3c;--ok:#45bd62;--warn:#f7b928;--bad:#ff5a5f;--a1:#2d88ff;--a2:#2d88ff;--dg:#3a3b3c;--sh:0 1px 2px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:400 16px/1.45 Figtree,system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--tx);background:var(--bg1)}
main{max-width:520px;margin:0 auto;padding:16px 16px 130px}
h1,h2,.num{font-family:Unbounded,Figtree,system-ui,sans-serif}
h1{font-size:24px;margin:0;letter-spacing:-.04em;color:var(--a1)}h2{font-size:15px;margin:0 0 12px;font-weight:500}
.top{gap:8px;display:flex;justify-content:space-between;align-items:center;padding:6px 2px}
.chip{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}button.chip{font:600 13px Figtree,sans-serif;color:var(--tx);cursor:pointer;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.car{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;color:var(--tx);font:inherit;cursor:pointer}.dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 10px rgba(255,255,255,.35)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:var(--sh);padding:18px;margin:14px 0}
.mut{color:var(--mut);font-size:14px}
.odo{display:flex;gap:6px;align-items:center}.odo i{font:700 clamp(28px,9vw,40px)/1 Unbounded,sans-serif;font-style:normal;color:#fff;background:linear-gradient(180deg,#4a4c4f,var(--dg) 55%,#4a4c4f);border-radius:10px;padding:12px 0;width:15.5%;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.25)}
.odo span{font-weight:700;margin-left:4px}
.gz{position:relative;width:min(260px,76vw);margin:4px auto 0}.gz svg{display:block;width:100%;overflow:visible}
.gz circle{fill:none;stroke-width:12}.gz .tk{stroke:var(--mut);stroke-width:5;opacity:.35}
.gz .pg{stroke:var(--st);stroke-linecap:round;transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 7px var(--st))}
.gz.ok{--st:var(--ok)}.gz.warn{--st:var(--warn)}.gz.bad{--st:var(--bad)}.gz.bad .pg{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{filter:drop-shadow(0 0 16px var(--st))}}
.gc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.gc strong{font:700 clamp(30px,10vw,42px)/1.1 Unbounded,sans-serif;color:var(--st)}.gc span{font-size:13px;color:var(--mut)}
.st{text-align:center;font-weight:700;margin-top:10px;color:var(--st)}.st small{display:block;font-weight:400;color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}
.big{font:700 24px/1.1 Unbounded,sans-serif;margin-top:4px}.big small{font:500 13px Figtree,sans-serif;color:var(--mut)}
.bars{position:relative;display:flex;align-items:flex-end;gap:5px;height:90px}.bars b{flex:1;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--a1),var(--a2));opacity:.55;min-height:4px}.bars b:last-child{opacity:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--bd)}.row:first-of-type{border-top:0}
.row .n{font-weight:700}.pill{font:700 13px Figtree;padding:4px 10px;border-radius:99px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;white-space:nowrap}
.x{background:none;border:0;color:var(--mut);font:600 13px Figtree;padding:8px;cursor:pointer}
.btn{width:100%;border:0;border-radius:8px;padding:14px;font:700 16px sans-serif;color:#fff;background:var(--a1);cursor:pointer}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none;margin-top:10px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin:0 0 12px}
input,textarea,select{display:block;width:100%;margin-top:6px;padding:14px;font:600 18px Figtree,sans-serif;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:14px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--a1);outline-offset:1px}textarea{font-size:12px;height:90px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{background:rgba(24,119,242,.12);border-radius:16px;padding:14px;margin:4px 0 16px;font-weight:600}
.v{display:none}.v.on{display:block}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:calc(100% - 24px);max-width:496px;display:flex;gap:4px;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 10px);background:var(--card);border:1px solid var(--bd);border-radius:26px 26px 0 0;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--sh);z-index:5}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mut);font:600 12px Figtree;padding:8px 0;border-radius:16px;cursor:pointer}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button{transition:color .2s}nav button.on{color:var(--g);font-weight:800}nav button.on svg{fill:currentColor}nav [data-go=trips].on circle{fill:var(--card)}nav svg{transition:fill .2s}nav button{--g:var(--a1)}nav .add{color:#fff;background:linear-gradient(135deg,#0099ff,#a033ff 55%,#ff5280);box-shadow:0 8px 20px rgba(160,51,255,.4)}nav .add.on{color:#fff}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tiles div{text-align:center;padding:16px 4px;border-radius:18px;background:var(--dg);color:#fff}.tiles b{display:block;font:700 26px Unbounded,sans-serif}.tiles span{font-size:13px;opacity:.7}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-90px);transition:transform .35s;background:var(--dg);color:#fff;padding:12px 20px;border-radius:99px;font-weight:700;z-index:40;box-shadow:var(--sh)}#toast.show{transform:translate(-50%,0)}
.menu{position:fixed;z-index:20;min-width:210px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);padding:6px}.menu button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:14px;background:none;border:0;color:var(--tx);font:600 16px sans-serif;padding:13px 14px;border-radius:8px;text-align:left;cursor:pointer}.menu button:active,.menu button:hover{background:var(--in)}.menu span{color:var(--a1);font-weight:700}.menu hr{border:0;border-top:1px solid var(--bd);margin:6px 0}.ttl{background:none;border:0;padding:0;margin:0;font:inherit;letter-spacing:inherit;color:inherit;text-align:left;cursor:pointer}.ab{margin:0;padding-left:20px;font-size:15px;line-height:1.5}.ab li{margin:8px 0}.ttl{display:flex;align-items:center;gap:10px}.ttl img{width:190px;height:auto;display:block}.ttl .lgd{display:none}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ttl .lgl{display:none}:root:not([data-theme="light"]) .ttl .lgd{display:block}}:root[data-theme="dark"] .ttl .lgl{display:none}:root[data-theme="dark"] .ttl .lgd{display:block}.pl{animation:dr 1.8s .3s ease-out both}@keyframes dr{from{stroke-dasharray:0 700}to{stroke-dasharray:700 0}}
.mh{display:flex;gap:16px;align-items:center}.av{flex:none;width:96px;height:96px;border-radius:50%;background:linear-gradient(145deg,#eaf3ff,#cfe2ff);border:3px solid #9cc4ff;display:flex;align-items:center;justify-content:center}.av svg{width:70px;height:36px;color:#1c1e21}.shi{display:flex;align-items:center;gap:12px}.shi svg{width:44px;height:44px;flex:none;color:var(--a1)}.di{display:block;width:64px;height:40px;margin:8px 0 6px;color:var(--a1);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:linear-gradient(145deg,#27405f,#1a2a41);border-color:#3f6fa8}}:root[data-theme="dark"] .av{background:linear-gradient(145deg,#27405f,#1a2a41);border-color:#3f6fa8}.mdl{font:800 26px/1.15 Sora,system-ui,sans-serif}
.plate{display:inline-block;margin-top:10px;border:2px solid var(--bd);border-radius:10px;padding:4px 14px;text-align:center;color:#1f8a3b;line-height:1.25}.plate div{font-size:14px;font-weight:700}.plate b{font-size:26px}
.lnk{display:block;width:100%;text-align:left;color:var(--tx);font:inherit;cursor:pointer}.lnk:active{opacity:.85}.bar{height:6px;border-radius:3px;background:var(--in);margin-top:6px}.bar i{display:block;height:100%;border-radius:3px;background:var(--a1)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--bd);margin:14px 0}.tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);font:600 14px sans-serif;padding:12px 12px;cursor:pointer}.tabs button.on{color:var(--tx);border-color:var(--a1)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(247,185,40,.16);border-radius:12px;padding:16px;margin:0 0 14px}
.bd{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;text-align:center;font-weight:700;background:var(--card)}.bd.warn{color:var(--warn);border-color:var(--warn)}.bd.bad{color:var(--bad);border-color:var(--bad)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .plate{color:#5fdc7e}}:root[data-theme="dark"] .plate{color:#5fdc7e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av svg{color:#e4e6eb}}:root[data-theme="dark"] .av svg{color:#e4e6eb}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(88vw,360px);background:var(--bg1);z-index:12;transform:translateX(-105%);transition:transform .28s;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 24px;box-shadow:8px 0 30px rgba(0,0,0,.3)}#drawer.open{transform:none}#dback{position:fixed;inset:0;z-index:11;border:0;padding:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .28s}#dback.open{opacity:1;pointer-events:auto}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.dh b{font:800 20px Sora,system-ui,sans-serif}
.alrt{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--bd);padding:12px 0;color:var(--tx);font:600 15px/1.3 sans-serif;text-align:left;cursor:pointer}.alrt:first-of-type{border-top:0}.alrt .at{flex:1}.ad{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}.alrt.warn .ad{background:var(--warn)}.alrt.bad .ad{background:var(--bad)}
.sinceb{margin-top:14px;padding-top:12px;border-top:1px solid var(--bd)}.three{display:flex;justify-content:space-between;margin-top:12px}.three div{text-align:center;flex:1}.three b{display:block;font:800 18px Sora,system-ui,sans-serif}
.avgl{position:absolute;left:0;right:0;border-top:2px dashed var(--mut);opacity:.7;pointer-events:none}.stk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}.stk i{display:block;border-radius:4px;min-height:2px}
.fbtn{display:block;text-align:center;margin-top:10px;padding:14px;border-radius:8px;background:var(--in);border:1px solid var(--bd);font:700 16px sans-serif;color:var(--tx);cursor:pointer}.fbtn input{display:none}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.enter>.card,.enter>.grid,.enter>.tabs,.enter>h2,.enter>p,.enter>button{animation:rise .38s both}.enter>:nth-child(2){animation-delay:.04s}.enter>:nth-child(3){animation-delay:.08s}.enter>:nth-child(4){animation-delay:.12s}.enter>:nth-child(5){animation-delay:.16s}.enter>:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const head=`<div class="card"><div class="mh"><div class="av"><svg viewBox="1.88 14.38 84.25 43.62"><use href="#mycaricon"/></svg></div><div><div class="mut">${esc(i.maker||"")}</div><div class="mdl">${esc(i.model||S.name)}</div>${pl?`<div class="plate"><div>${esc(((i.region||"")+" "+(i.cls||"")).trim())}</div><b>${esc(((i.kana||"")+" "+(i.num||"")).trim())}</b></div>`:""}</div></div></div>`;
const f=(l,k,v,t,ph)=>`<label>${l}<input data-k="${k}" type="${t||"text"}" value="${esc(v==null?"":v)}" placeholder="${ph||""}"></label>`;
if(me){$("#v-mycar").innerHTML=head+`<div class="card"><h2>Edit car info</h2>${f("Maker","maker",i.maker)}${f("Model","model",i.model)}<label>Number plate<div class="two"><input data-k="region" value="${esc(i.region||"")}" placeholder="岐阜"><input data-k="cls" value="${esc(i.cls||"")}" placeholder="58A"></div><div class="two" style="margin-top:8px"><input data-k="kana" value="${esc(i.kana||"")}" placeholder="う"><input data-k="num" value="${esc(i.num||"")}" placeholder="82-87"></div></label>${f("Shaken expiry date","shaken",i.shaken,"date")}<div class="two">${f("Length","len",i.len,"number","mm")}${f("Width","wid",i.wid,"number","mm")}</div><div class="two">${f("Height","hei",i.hei,"number","mm")}${f("Weight","wt",i.wt,"number","kg")}</div>${f("Engine oil","spec.oil",sp.oil)}${f("Tire size","spec.tire",sp.tire)}${f("Battery","spec.battery",sp.battery)}${f("Wiper blades","spec.wiper",sp.wiper)}<button class="btn" data-msave>Save</button><button class="btn alt" data-mcancel>Cancel</button></div>`;return}
let b="";
if(mt==0){const dl=i.shaken?Math.round((new Date(i.shaken+"T00:00")-new Date(today()+"T00:00"))/864e5):null;
b=`<div class="sh"><div class="shi">${IC.shield}<div><div class="mut">Shaken expiry date</div><div class="n" style="font-size:20px">${i.shaken?fd(i.shaken):"Not set"}</div></div></div>${dl==null?"":`<div class="bd ${dl<0?"bad":dl<60?"warn":""}">${dl<0?"Expired "+(-dl)+" days ago":dl+" days left"}</div>`}</div><div class="grid">${[["Length","len","mm"],["Width","wid","mm"],["Height","hei","mm"],["Weight","wt","kg"]].map(([l,k,u])=>`<div class="card"><span class="mut">${l}</span>${IC[k]}<div class="big">${i[k]?nf(i[k]):"—"} <small>${i[k]?u:""}</small></div></div>`).join("")}</div><button class="btn" style="margin-top:14px" data-medit>Edit car info</button>`}
else if(mt==1){const{o,since}=info();
b=`<div class="card"><h2>Engine oil status</h2><div class="row"><span class="mut">Last oil change</span><span class="n">${o?fd(o.d):"Not set"}</span></div><div class="row"><span class="mut">Driven since change</span><span class="n">${since==null?"—":nf(since)+" km"}</span></div></div><div class="card"><h2>Add maintenance</h2><div class="two"><label>Date<input id="md" type="date" value="${today()}"></label><label>Cost (円)<input id="mc" type="number" inputmode="numeric"></label></div><label>Work done<input id="mw" type="text" placeholder="e.g. Tire change"></label><button class="btn" data-mrec>Save record</button></div><div class="card"><h2>Maintenance log</h2>${m.length?m.map((x,k)=>[x,k]).sort((a,c)=>c[0].d.localeCompare(a[0].d)).map(([x,k])=>em===k?`<div class="row" style="display:block"><div class="two"><label>Date<input id="em_d" type="date" value="${x.d}"></label><label>Cost (円)<input id="em_c" type="number" inputmode="numeric" value="${x.c||""}"></label></div><label>Work done<input id="em_w" type="text" value="${esc(x.w)}"></label><div class="two"><button class="btn" data-emsave="${k}">Save</button><button class="btn alt" data-emcancel style="margin-top:0">Cancel</button></div></div>`:`<div class="row"><div><div class="n">${esc(x.w)}</div><div class="mut">${fd(x.d)}${x.c?" · "+nf(x.c)+" 円":""}</div></div><div><button class="x" data-edm="${k}">Edit</button><button class="x" data-delm="${k}">Delete</button></div></div>`).join(""):`<p class="mut" style="margin:0">No records yet.</p>`}</div>`}
else if(mt==3)b=costTab();
else if(mt==4)b=tripTab();
else b=`<div class="card"><h2>Parts that fit this car</h2>${[["Engine oil","oil"],["Tire size","tire"],["Battery","battery"],["Wiper blades","wiper"]].map(([l,k])=>`<div class="row"><span class="mut">${l}</span><span class="n">${esc(sp[k]||"—")}</span></div>`).join("")}</div><button class="btn" data-medit>Edit car info</button>`;
$("#v-mycar").innerHTML=head+`<div class="tabs">${["Vehicle info","Maintenance info","Compatibility info","Car costs"].map((x,k)=>`<button data-mt="${k}" class="${k==mt?"on":""}">${x}</button>`).join("")}</div>`+b}
let show=false,view="garage";
function go(v){view=v;document.querySelectorAll("main .v").forEach(e=>e.classList.toggle("on",e.id=="v-"+v));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.go==v));({home,oil,add,trips,garage,mycar})[v]();{const el=$("#v-"+v);if(el){el.classList.add("enter");setTimeout(()=>el.classList.remove("enter"),700)}}$("nav").style.display=v=="garage"?"none":"";hdr();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.menu){const m=$("#menu");if(!m.hidden&&m.dataset.k==d.menu)closeMenu();else openMenu(d.menu,t)}
else if(d.setlang){closeMenu();lang=d.setlang;try{localStorage.setItem("zishan.lang",lang)}catch(x){}setLang();go(view);trAll(true)}
else if(d.switch){closeMenu();S=DB.cars.find(c=>c.id==d.switch);DB.cur=d.switch;save();show=false;go(view=="garage"?"home":view)}
else if("addcar"in d){closeMenu();go("garage");newcar()}
else if("oundo"in d){delete S.odo;oe=false;save();toast("Odometer reset");home()}
else if("oe"in d){oe=!oe;home()}
else if("ocancel"in d){oe=false;home()}
else if("osave"in d){const k=+$("#om").value,{cur}=info();if(!(k>0))return toast("Enter the current meter");S.odo={d:today(),k};oe=false;save();toast("Odometer updated");home()}
else if(d.edf!=null){ef=+d.edf;home()}
else if("efcancel"in d){ef=null;home()}
else if(d.efsave!=null){const ix=+d.efsave,o=S.fills[ix],dt=$("#ef_d").value,m=+$("#ef_m").value,l=+$("#ef_l").value,p=+$("#ef_p").value;
if(!dt||!(m>0))return toast("Enter date and meter");if(!(l>0&&p>0))return toast("Enter litres and price");
const R=rows(),pos=R.findIndex(x=>x.ref===o),pv=R[pos-1].m,nx=R[pos+1]?R[pos+1].m:null;
if(!(m>pv&&(nx==null||m<nx)))return toast(nx==null?"Meter must be above "+nf(pv)+" km":"Meter must be between "+nf(pv)+" and "+nf(nx)+" km");
if(S.odo&&S.odo.k==o.m)S.odo.k=m;Object.assign(o,{d:dt,m,l,p});ef=null;save();toast("Saved");home()}
else if(d.edm!=null){em=+d.edm;mycar()}
else if("emcancel"in d){em=null;mycar()}
else if(d.emsave!=null){const w=$("#em_w").value.trim();if(!w)return toast("Enter the work done");Object.assign(S.info.maint[+d.emsave],{d:$("#em_d").value||today(),w,c:+$("#em_c").value||0});em=null;save();toast("Saved");mycar()}
else if("csave"in d){const a=+$("#nca").value;if(!(a>0))return toast("Enter an amount");S.costs.push({c:$("#ncc").value,a,f:$("#ncf").value,d:$("#ncd").value||today(),n:$("#ncn").value.trim()});save();toast("Cost saved");mycar()}
else if(d.edc!=null){ec=+d.edc;mycar()}
else if("eccancel"in d){ec=null;mycar()}
else if(d.ecsave!=null){const a=+$("#eca").value;if(!(a>0))return toast("Enter an amount");Object.assign(S.costs[+d.ecsave],{c:$("#ecc").value,a,f:$("#ecf").value,d:$("#ecd").value||today(),n:$("#ecn").value.trim()});ec=null;save();toast("Saved");mycar()}
else if(d.delc!=null){S.costs.splice(+d.delc,1);save();toast("Deleted");mycar()}
else if("tocost"in d){mt=3;go("mycar")}
else if("dopen"in d)openDrawer();
else if("dclose"in d)closeDrawer();
else if("topen"in d)go("trips")
else if("tstart"in d){const s=$("#tss").value;if(s===""||!(+s>=0))return toast("Enter the current meter");S.trip={d:today(),p:$("#tsp").value,n:$("#tsn").value.trim(),s:+s};save();toast("Trip started");trips()}
else if("tend"in d){const e=+$("#te").value,a=S.trip;if(!(e>a.s))return toast("End meter must be above the start");(S.trips=S.trips||[]).push({d:a.d,p:a.p,n:a.n,km:e-a.s,s:a.s,e});S.odo={d:today(),k:e};S.trip=null;save();toast("Trip saved");trips()}
else if("tcancel"in d){S.trip=null;save();trips()}
else if("tsave"in d){const k=+$("#tpk").value,w=+$("#tpw").value||1,x=+$("#tpx").value||1;if(!(k>0))return toast("Enter the distance");(S.trips=S.trips||[]).push({d:$("#tpd").value||today(),p:$("#tpp").value,n:$("#tpn").value.trim(),km:k*w*x});save();toast("Trip saved");trips()}
else if(d.tp!=null){tp=+d.tp;trips()}
else if(d.edt!=null){et=+d.edt;trips()}
else if("etcancel"in d){et=null;trips()}
else if(d.etsave!=null){const k=+$("#et_k").value;if(!(k>0))return toast("Enter the distance");Object.assign(S.trips[+d.etsave],{d:$("#et_d").value||today(),p:$("#et_p").value,n:$("#et_n").value.trim(),km:k});et=null;save();toast("Saved");trips()}
else if(d.delt!=null){S.trips.splice(+d.delt,1);save();toast("Deleted");trips()}
else if(d.mt!=null){mt=+d.mt;mycar()}
else if("medit"in d){me=true;mycar()}
else if("mcancel"in d){me=false;mycar()}
else if("msave"in d){const i=S.info,sp=i.spec=i.spec||{};document.querySelectorAll("#v-mycar [data-k]").forEach(e=>{const k=e.dataset.k,v=e.value.trim();if(k.startsWith("spec."))sp[k.slice(5)]=v;else i[k]=v});me=false;save();toast("Saved");mycar()}
else if("mrec"in d){const w=$("#mw").value.trim();if(!w)return toast("Enter the work done");(S.info.maint=S.info.maint||[]).push({d:$("#md").value||today(),w,c:+$("#mc").value||0});save();toast("Record saved");mycar()}
else if(d.delm!=null){S.info.maint.splice(+d.delm,1);save();mycar()}
else if(d.go)go(d.go);
else if(d.pick){S=DB.cars.find(c=>c.id==d.pick);DB.cur=d.pick;save();show=false;go("home")}
else if(d.rmcar){if(!t.dataset.arm){t.dataset.arm=1;t.textContent="Tap again to remove this car and its data";setTimeout(()=>{if(view=="garage"&&!$("#nn"))garage()},3500);return}DB.cars=DB.cars.filter(c=>c.id!=d.rmcar);if(S&&S.id==d.rmcar)S=null;save();toast("Car removed");garage()}
else if("newcar"in d)newcar();
else if("mkcar"in d){const n=$("#nn").value.trim(),m=+$("#nm").value,o=+$("#no").value,s=$("#ns").value||today();if(!n)return toast("Enter the car name");if(!(m>0))return toast("Enter the current meter");const c={id:"c"+Date.now(),name:n,since:s,fills:[{d:s,m,l:0,p:0}],oil:o>0?[{d:s,k:o}]:[]};DB.cars.push(c);DB.cur=c.id;S=c;save();toast("Car added");show=false;go("home")}
else if("more"in d){show=!show;home()}
else if(d.del!=null){if(!t.dataset.arm){t.dataset.arm=1;t.textContent="Tap again to delete";setTimeout(()=>home(),2500);return}if(S.fills.length>1){const gone=S.fills[+d.del];S.fills.splice(+d.del,1);if(S.odo&&gone&&S.odo.k==gone.m)delete S.odo;save();toast("Deleted");home()}}
else if(d.delo!=null){S.oil.splice(+d.delo,1);save();oil()}
else if("oil"in d){const dt=$("#od").value,k=+$("#ok").value;if(!dt||!(k>0))return toast("Enter date and meter");S.oil.push({d:dt,k});save();toast("Oil change saved");oil()}
else if("save"in d){const o={d:$("#fd").value,m:+$("#fm").value,l:+$("#fl").value,p:+$("#fp").value},{last,cur}=info(),need=Math.max(last.m+1,cur);
if(!o.d||!(o.m>=need))return toast("Meter must be above "+nf(need-1)+" km");if(!(o.l>0&&o.p>0))return toast("Enter litres and price");S.fills.push(o);S.odo={d:o.d,k:o.m};save();toast("Fill-up saved");go("home")}
else if("copy"in d){const a=$("#bk");a.select();try{document.execCommand("copy");DB.lastBackup=today();save();toast("Copied")}catch(x){toast("Select and copy the text")}}
else if("dlbk"in d){if(dl("vehiclepulse-backup-"+today()+".json",JSON.stringify(DB),"application/json")){DB.lastBackup=today();save();toast("Backup file saved")}}
else if("csv"in d){if(dl("vehiclepulse-fuel-"+today()+".csv",csvText(),"text/csv"))toast("CSV file saved")}
else if("install"in d){if(ip){ip.prompt();ip=null;$("#instb").hidden=true}}
else if(d.ago){if(d.ago=="oil")go("oil");else if(d.ago=="mycar"){mt=0;go("mycar")}else openDrawer()}
else if("restore"in d){try{const j=JSON.parse($("#bk").value);if(!j.cars||!j.cars.length)throw 0;DB=j;if(!DB.created)DB.created=today();S=DB.cars[0];save();toast("Restored");closeDrawer();go("garage")}catch(x){toast("That backup is not valid")}}});
setInterval(()=>{if($("#drawer").classList.contains("open"))tick()},1000);
document.addEventListener("change",e=>{if(e.target.id=="bkf"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{$("#bk").value=r.result;toast("File loaded. Tap Restore to apply it.")};r.readAsText(e.target.files[0])}});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;const b=$("#instb");if(b)b.hidden=false});addEventListener("appinstalled",()=>{ip=null;const b=$("#instb");if(b)b.hidden=true});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
let sw=null;document.addEventListener("touchstart",e=>{const t=e.touches[0];sw={x:t.clientX,y:t.clientY,open:$("#drawer").classList.contains("open")}},{passive:true});
document.addEventListener("touchmove",e=>{if(!sw)return;const t=e.touches[0],dx=t.clientX-sw.x,dy=Math.abs(t.clientY-sw.y);if(dy>40){sw=null;return}if(!sw.open&&sw.x<28&&dx>60){sw=null;openDrawer()}else if(sw.open&&dx<-60){sw=null;closeDrawer()}},{passive:true});
go("garage");
setLang();document.addEventListener("click",e=>{if(!e.target.closest("#menu,[data-menu]"))closeMenu()});mo.observe(document.body,{childList:true,subtree:true,characterData:true});trAll();
if("serviceWorker"in navigator){const had=!!navigator.serviceWorker.controller;let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!rl&&!document.querySelector("input:focus,textarea:focus,select:focus")){rl=true;location.reload()}});addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script></body></html>
